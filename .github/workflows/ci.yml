name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Node dependencies
        run: npm ci

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Run offline backend tests
        run: npm run test:backend -- -q

      - name: Type-check desktop and E2E code
        run: npm run typecheck

      - name: Build desktop renderer
        run: npm run build

      - name: Validate documentation
        run: npm run validate:docs
